<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="/dreamhub/assets/css/style.css" />

  <!-- Shared config must come first -->
  <script defer src="/dreamhub/assets/js/config.js"></script>
  <script defer src="/dreamhub/assets/js/layout.js"></script>
  
  <!-- App specific -->
  <link rel="stylesheet" href="./invite.css" />
  <script defer src="./config.js"></script>
  <script defer src="./invite.js"></script>
  

  <link rel="stylesheet" href="./invite.css">
  <title>DreamHub • Invitation Maker</title>
</head>

<body>
  <div id="dh-header"></div>
  <main class="dh-wrap">
  <!-- Simple DreamHub header (matches your other apps vibe) -->

  <div class="dh-wrap">
    <div class="dh-card">
      <h1 class="dh-title">Create an Invitation</h1>
      <p class="dh-sub">
        Host email is required so you can always access your dashboard link.
        Share the guest link anywhere.
      </p>

      <div class="dh-grid">
        <label class="dh-label dh-full">Event title <span class="dh-muted">(required)</span>
          <input id="title" class="dh-input" placeholder="e.g., Celebration Dinner"/>
        </label>

        <label class="dh-label">Date &amp; time <span class="dh-muted">(required)</span>
          <input id="dt" class="dh-input" type="datetime-local"/>
        </label>

        <label class="dh-label">Location
          <input id="location" class="dh-input" placeholder="e.g., Our Home / Park / Restaurant"/>
        </label>

        <label class="dh-label dh-full">Message (optional)
          <textarea id="message" class="dh-textarea" rows="4" placeholder="Add a short note for guests..."></textarea>
        </label>

        <label class="dh-label">RSVP deadline (optional)
          <input id="deadline" class="dh-input" type="datetime-local"/>
        </label>

        <label class="dh-label">Host email <span class="dh-muted">(required)</span>
          <input id="hostEmail" class="dh-input" placeholder="you@example.com"/>
          <div class="dh-muted" style="margin-top:6px">We’ll email your private dashboard link here.</div>
        </label>
      </div>

      <div class="dh-row" style="margin-top:12px">
        <button id="createBtn" class="dh-btn dh-btn-primary">Create invitation</button>
        <span id="status" class="dh-muted"></span>
      </div>
    </div>

    <div id="result" class="dh-card" style="display:none">
      <h2 style="margin:0 0 6px;">Invitation created ✅</h2>
      <div class="dh-muted" id="sentMsg" style="margin-bottom:10px"></div>

      <div class="dh-muted" style="margin:10px 0 6px">Guest RSVP link (share this)</div>
      <input id="guestLink" class="dh-input" readonly />
      <button id="copyGuest" class="dh-btn" style="margin-top:8px">Copy guest link</button>
      <span id="copyGuestMsg" class="dh-muted" style="margin-left:10px"></span>

      <hr style="margin:18px 0"/>

      <div class="dh-muted" style="margin:10px 0 6px">Host dashboard link (private)</div>
      <input id="hostLink" class="dh-input" readonly />
      <button id="copyHost" class="dh-btn" style="margin-top:8px">Copy host link</button>
      <span id="copyHostMsg" class="dh-muted" style="margin-left:10px"></span>
    </div>

    <div class="dh-footer">
      <div class="dh-muted">© DreamHub • Simple apps for everyday needs</div>
    </div>
  </div>
</main>

<div id="dh-footer"></div>
</body>
</html>
