<!doctype html>
<html><head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="./invite.css">
<title>DreamHub • Invitation Maker</title>
</head><body>
  <div id="dh-header"></div>
<div class="dh-wrap">
  <div class="dh-card">
    <h1 class="dh-title">Create an Invitation</h1>
    <p class="dh-sub">Host email is required so you can always access your dashboard link. Share the guest link anywhere.</p>
    <div class="dh-grid">
      <label class="dh-label dh-full">Event title <span class="dh-muted">(required)</span>
        <input id="title" class="dh-input" placeholder="e.g., Celebration Dinner"/></label>
      <label class="dh-label">Date & time <span class="dh-muted">(required)</span>
        <input id="dt" class="dh-input" type="datetime-local"/></label>
      <label class="dh-label">Location
        <input id="location" class="dh-input" placeholder="e.g., Our Home / Park / Restaurant"/></label>
      <label class="dh-label dh-full">Message (optional)
        <textarea id="message" class="dh-textarea" rows="4" placeholder="Add a short note for guests…"></textarea></label>
      <label class="dh-label">RSVP deadline (optional)
        <input id="deadline" class="dh-input" type="datetime-local"/></label>
      <label class="dh-label">Host email <span class="dh-muted">(required)</span>
        <input id="hostEmail" class="dh-input" placeholder="you@example.com"/>
        <span class="dh-muted">We’ll email your private dashboard link here.</span></label>
    </div>
    <div class="dh-row" style="margin-top:12px">
      <button id="createBtn" class="dh-btn dh-btn-primary">Create invitation</button>
      <span id="status" class="dh-muted"></span>
    </div>
  </div>

  <div id="result" class="dh-card" style="display:none;">
    <h2 style="margin:0 0 6px;">Invitation created ✅</h2>
    <div class="dh-muted" id="sentMsg"></div>

    <div style="margin-top:14px" class="dh-grid">
      <label class="dh-label dh-full">Guest RSVP link (share this)
        <input id="guestLink" class="dh-input" readonly /></label>
      <div class="dh-row">
        <button id="copyGuest" class="dh-btn dh-btn-ghost">Copy guest link</button>
        <span class="dh-muted">Share with guests. Anyone with link can RSVP.</span>
      </div>

      <label class="dh-label dh-full">Host dashboard link (private)
        <input id="hostLink" class="dh-input" readonly /></label>
      <div class="dh-row">
        <button id="copyHost" class="dh-btn dh-btn-ghost">Copy host link</button>
        <span class="dh-muted">Keep private. Also emailed to you.</span>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="dh-toast"></div>

<script src="./config.js"></script>
<script src="./invite.js"></script>
<script src="../../assets/js/layout.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  function setStatus(msg, kind) {
    const el = $("status");
    el.textContent = msg || "";
    el.style.color = kind === "bad" ? "#b3261e" : "";
  }
  function appBaseUrl() {
    return location.origin + (window.DH && window.DH.inviteBase ? window.DH.inviteBase : "/dreamhub/apps/invite");
  }

  $("createBtn").onclick = async () => {
    try {
      setStatus("Creating…");
      const payload = {
        title: $("title").value.trim(),
        datetimeISO: $("dt").value,
        location: $("location").value.trim(),
        message: $("message").value.trim(),
        deadlineISO: $("deadline").value,
        hostEmail: $("hostEmail").value.trim(),
        appBase: appBaseUrl()
      };
      const res = await window.DH.invite.api("createEvent", payload);
      $("guestLink").value = res.guestLink;
      $("hostLink").value = res.hostLink;
      $("sentMsg").textContent = "We emailed the dashboard link to: " + res.hostEmail;
      $("result").style.display = "block";
      window.DH.invite.toast("Invitation created ✅","ok");
      setStatus("Done ✅");
    } catch (e) {
      console.error(e);
      window.DH.invite.toast(e.message || "Failed","bad");
      setStatus(e.message || "Failed","bad");
    }
  };

  $("copyGuest").onclick = async () => {
    const ok = await window.DH.invite.copyText($("guestLink").value);
    window.DH.invite.toast(ok ? "Guest link copied ✅" : "Copy failed", ok ? "ok" : "bad");
  };
  $("copyHost").onclick = async () => {
    const ok = await window.DH.invite.copyText($("hostLink").value);
    window.DH.invite.toast(ok ? "Host link copied ✅" : "Copy failed", ok ? "ok" : "bad");
  };
</script>
<div id="dh-header"></div>

</body></html>
