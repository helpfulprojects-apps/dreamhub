<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="/dreamhub/assets/css/style.css" />

  <!-- Shared config must come first -->
  <script defer src="/dreamhub/assets/js/config.js"></script>
  <script defer src="/dreamhub/assets/js/layout.js"></script>
  
  <!-- App specific -->
  <link rel="stylesheet" href="./invite.css" />
  <script defer src="./config.js"></script>
  <script defer src="./invite.js"></script>
  <script src="./host.js"></script>

  <title>DreamHub • Host Dashboard</title>
</head>

<body>
  <div id="dh-header"></div>

  <main class="dh-wrap">
<div class="dh-wrap">
  <div class="dh-card">
    <h1 class="dh-title">Host Dashboard</h1>
    <div class="dh-row" style="margin-top:12px">
      <button id="copyGuest" class="dh-btn dh-btn-ghost">Copy Guest Link</button>
      <button id="refreshBtn" class="dh-btn dh-btn-ghost">Refresh</button>
      <span id="status" class="dh-muted"></span>
    </div>
  </div>

  <div class="dh-card">
    <h2 style="margin:0 0 10px;">Summary</h2>
    <div class="dh-kv">
      <div class="dh-pill">✅ Yes: <b id="sumYes">0</b></div>
      <div class="dh-pill">❓ Maybe: <b id="sumMaybe">0</b></div>
      <div class="dh-pill">❌ No: <b id="sumNo">0</b></div>
    </div>
    <div class="dh-muted">Yes/Maybe show total people (adults + kids). No shows response count.</div>
  </div>

  <div class="dh-card">
    <h2 style="margin:0 0 10px;">RSVP List</h2>
    <div id="rsvpList" class="dh-muted">Loading…</div>
  </div>
</div>
</main>

<div id="dh-footer"></div>
</body>
</html>
