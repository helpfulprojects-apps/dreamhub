<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Invitation Maker • DreamHub</title>
      
        <link rel="stylesheet" href="/dreamhub/assets/css/style.css" />
      
        <!-- IMPORTANT: config must load BEFORE layout -->
        <script defer src="/dreamhub/assets/js/config.js"></script>
        <script defer src="/dreamhub/assets/js/layout.js"></script>
      
        <!-- App scripts (after layout) -->
        <script defer src="./config.js"></script>
        <script defer src="./invite.js"></script>
      </head>
      


<body class="dh-app">
  <div id="dh-header"></div>

  <main class="container">
    <div class="breadcrumbs">
      <a href="/dreamhub/">Home</a> / <a href="/dreamhub/apps.html">Apps</a> / Invitation Maker / Host
    </div>

    <div class="viewer">
      <div class="panel">
        <div class="panel-head">
          <strong>Unlock Dashboard</strong>
          <span class="muted small">PIN or Recovery Code</span>
        </div>
        <div class="panel-body">
          <div id="hostNotice" class="notice" style="display:none;"></div>

          <label class="small muted">Event ID</label>
          <input id="eventId" class="input" />

          <label class="small muted">Admin PIN (or Recovery Code)</label>
          <input id="secret" class="input" placeholder="Enter PIN or Recovery Code" />

          <button id="btnLoad" class="btn">Load Dashboard</button>

          <div class="notice" style="margin-top:10px;">
            <strong>Note:</strong> Keep host link private. Anyone with PIN/Recovery can view responses.
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <strong id="dashTitle">Dashboard</strong>
          <span class="muted small">Summary</span>
        </div>
        <div class="panel-body" id="dashBody">
          Enter Event ID + PIN/Recovery to view responses.
        </div>
      </div>
    </div>
  </main>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    window.DH_LAYOUT?.renderHeader?.("dh-header");

    const ev = window.DH.inviteApi.q("event");
    if (ev) document.getElementById("eventId").value = ev;

    document.getElementById("btnLoad").addEventListener("click", async () => {
      const eventId = document.getElementById("eventId").value.trim();
      const secret = document.getElementById("secret").value.trim();

      if (!eventId || !secret) {
        showNotice("Please enter Event ID and PIN/Recovery Code.", true);
        return;
      }

      try {
        const res = await window.DH.inviteApi.api("dashboard", { eventId, secret });
        if (!res.ok) throw new Error(res.error || "Failed");

        document.getElementById("dashTitle").textContent = res.event.title + " • Dashboard";

        const s = res.summary;
        const rows = res.rsvps.map(r => `
          <tr>
            <td>${window.DH.inviteApi.esc(r.guestName)}</td>
            <td>${window.DH.inviteApi.esc(r.response)}</td>
            <td>${r.adults}</td>
            <td>${r.kids}</td>
            <td>${window.DH.inviteApi.esc(r.notes || "")}</td>
            <td class="muted small">${window.DH.inviteApi.esc(r.updatedAt)}</td>
          </tr>
        `).join("");

        document.getElementById("dashBody").innerHTML = `
          <div class="notice">
            <div><strong>Total Responses:</strong> ${s.total}</div>
            <div><strong>Yes:</strong> ${s.yes} | <strong>No:</strong> ${s.no} | <strong>Maybe:</strong> ${s.maybe}</div>
            <div><strong>Total Adults:</strong> ${s.totalAdults} | <strong>Total Kids:</strong> ${s.totalKids}</div>
          </div>

          <table class="table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Response</th>
                <th>Adults</th>
                <th>Kids</th>
                <th>Notes</th>
                <th>Updated</th>
              </tr>
            </thead>
            <tbody>
              ${rows || `<tr><td colspan="6" class="muted small">No RSVPs yet.</td></tr>`}
            </tbody>
          </table>
        `;

        showNotice("Dashboard loaded ✅", false);
      } catch (e) {
        showNotice(e.message, true);
      }
    });

    function showNotice(msg, isErr) {
      const el = document.getElementById("hostNotice");
      el.style.display = "block";
      el.className = "notice" + (isErr ? " error" : "");
      el.textContent = msg;
    }
  });
</script>

</body>
</html>
