<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RSVP • DreamHub</title>

  <link rel="stylesheet" href="/dreamhub/assets/css/style.css" />
  <script src="/dreamhub/assets/js/layout.js"></script>

  <script src="./config.js"></script>
  <script src="./invite.js"></script>
</head>

<body class="dh-app">
  <div id="dh-header"></div>

  <main class="container">
    <div class="breadcrumbs">
      <a href="/dreamhub/">Home</a> / <a href="/dreamhub/apps.html">Apps</a> / Invitation Maker / RSVP
    </div>

    <div class="viewer">
      <div class="panel">
        <div class="panel-head">
          <strong id="evTitle">Invitation</strong>
          <span class="muted small">Details</span>
        </div>
        <div class="panel-body" id="evDetails">
          Loading...
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <strong>RSVP</strong>
          <span class="muted small">Your response</span>
        </div>
        <div class="panel-body">
          <div id="rsvpNotice" class="notice" style="display:none;"></div>

          <label class="small muted">Your Name / Family</label>
          <input id="guestName" class="input" placeholder="e.g., Chandu Family" />

          <label class="small muted">Response</label>
          <select id="response" class="input">
            <option value="yes">Yes, I’m coming</option>
            <option value="no">No, I can’t</option>
            <option value="maybe">Maybe</option>
          </select>

          <label class="small muted">Adults</label>
          <input id="adults" type="number" class="input" min="0" value="1" />

          <label class="small muted">Kids</label>
          <input id="kids" type="number" class="input" min="0" value="0" />

          <label class="small muted">Notes (optional)</label>
          <textarea id="notes" class="input" rows="4" placeholder="Allergies / arrival time / anything..."></textarea>

          <button id="btnSubmit" class="btn">Submit RSVP</button>
        </div>
      </div>
    </div>
  </main>

<script>
  document.addEventListener("DOMContentLoaded", async () => {
    window.DH_LAYOUT?.renderHeader?.("dh-header");

    const eventId = DH_INVITE.q("event");
    const openToken = DH_INVITE.q("t");

    if (!eventId || !openToken) {
      document.getElementById("evDetails").innerHTML = `<div class="notice error">Invalid link. Missing event or token.</div>`;
      return;
    }

    try {
      const res = await DH_INVITE.api("public", { eventId, openToken });
      if (!res.ok) throw new Error(res.error || "Failed to load invite");

      document.title = `RSVP • ${res.event.title}`;
      document.getElementById("evTitle").textContent = res.event.title;

      const e = res.event;
      document.getElementById("evDetails").innerHTML = `
        <div><strong>Host:</strong> ${DH_INVITE.esc(e.hostName)}</div>
        <div><strong>Date:</strong> ${DH_INVITE.esc(e.date)}</div>
        <div><strong>Time:</strong> ${DH_INVITE.esc(e.time)}</div>
        ${e.location ? `<div><strong>Location:</strong> ${DH_INVITE.esc(e.location)}</div>` : ""}
        ${e.rsvpBy ? `<div><strong>RSVP By:</strong> ${DH_INVITE.esc(e.rsvpBy)}</div>` : ""}
        ${e.message ? `<div style="margin-top:10px;"><strong>Message:</strong><br/>${DH_INVITE.nl2br(DH_INVITE.esc(e.message))}</div>` : ""}
      `;

      document.getElementById("btnSubmit").addEventListener("click", async () => {
        const payload = {
          eventId,
          openToken,
          guestName: document.getElementById("guestName").value.trim(),
          response: document.getElementById("response").value,
          adults: Number(document.getElementById("adults").value || 0),
          kids: Number(document.getElementById("kids").value || 0),
          notes: document.getElementById("notes").value.trim(),
        };

        if (!payload.guestName) {
          showNotice("Please enter your name/family.", true);
          return;
        }

        try {
          const r = await DH_INVITE.api("rsvp", payload);
          if (!r.ok) throw new Error(r.error || "RSVP failed");
          showNotice("Thanks! Your RSVP was saved ✅", false);
        } catch (err) {
          showNotice(err.message, true);
        }
      });

    } catch (err) {
      document.getElementById("evDetails").innerHTML = `<div class="notice error">${DH_INVITE.esc(err.message)}</div>`;
    }

    function showNotice(msg, isErr) {
      const el = document.getElementById("rsvpNotice");
      el.style.display = "block";
      el.className = "notice" + (isErr ? " error" : "");
      el.textContent = msg;
    }
  });
</script>

</body>
</html>
