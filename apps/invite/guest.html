<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>DreamHub • RSVP</title>

  <link rel="stylesheet" href="/dreamhub/assets/css/style.css" />

  <!-- Shared config must come first -->
  <script defer src="/dreamhub/assets/js/config.js"></script>
  <script defer src="/dreamhub/assets/js/layout.js"></script>
  
  <!-- App specific -->
  <link rel="stylesheet" href="./invite.css" />
  <script defer src="./config.js"></script>
  <script defer src="./invite.js"></script>
  
  <script src="./guest.js"></script>
  <script src="/dreamhub/assets/js/layout.js"></script>

</head>

<body>
  <div id="dh-header"></div>

  <main class="dh-wrap">
  <div class="dh-wrap">
    <div class="dh-card">
      <h1 id="title" class="dh-title">Loading…</h1>
      <div class="dh-muted" id="meta"></div>
      <p id="message" style="margin-top:10px"></p>
      <div class="dh-muted" id="deadlineNote" style="margin-top:8px"></div>
    </div>

    <div class="dh-card">
      <h2 style="margin:0 0 10px;">RSVP</h2>

      <div class="dh-grid">
        <label class="dh-label dh-full">Your name <span class="dh-muted">(required)</span>
          <input id="guestName" class="dh-input" placeholder="e.g., Priya"/>
        </label>

        <label class="dh-label dh-full">Are you coming? <span class="dh-muted">(required)</span>
          <div class="dh-row" style="gap:16px">
            <label class="dh-row"><input type="radio" name="status" value="YES" checked> Yes</label>
            <label class="dh-row"><input type="radio" name="status" value="MAYBE"> Maybe</label>
            <label class="dh-row"><input type="radio" name="status" value="NO"> No</label>
          </div>
        </label>

        <label class="dh-label">Adults (13+)
          <div class="dh-stepper">
            <button type="button" id="adultsMinus">−</button>
            <input id="adults" class="dh-input" value="0" inputmode="numeric"/>
            <button type="button" id="adultsPlus">+</button>
          </div>
        </label>

        <label class="dh-label">Kids (0–12)
          <div class="dh-stepper">
            <button type="button" id="kidsMinus">−</button>
            <input id="kids" class="dh-input" value="0" inputmode="numeric"/>
            <button type="button" id="kidsPlus">+</button>
          </div>
        </label>

        <label class="dh-label dh-full">Food preference (optional)
          <select id="food" class="dh-select">
            <option value="">No preference</option>
            <option value="VEG">Vegetarian</option>
            <option value="NONVEG">Non-veg</option>
            <option value="VEGAN">Vegan</option>
          </select>
        </label>

        <label class="dh-label dh-full">Note (optional)
          <textarea id="note" class="dh-textarea" rows="3" placeholder="Allergies / questions / anything else…"></textarea>
        </label>
      </div>

      <div class="dh-row" style="margin-top:12px">
        <button id="submitBtn" class="dh-btn dh-btn-primary">Submit RSVP</button>
        <span id="status" class="dh-muted"></span>
      </div>
    </div>
  </div>
</main>

<div id="dh-footer"></div>
</body>
</html>
