<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Worksheet - DreamHub</title>

<script src="" id="dhBaseScript"></script>
<link rel="stylesheet" href="" id="dhCss">
<script>
  (function(){
    var parts = window.location.pathname.split('/').filter(Boolean);
    var base = (window.location.hostname.endsWith('github.io') && parts.length>=1) ? '/' + parts[0] + '/' : '/';
    document.getElementById('dhCss').href = base + 'assets/css/site.css';
    document.getElementById('dhBaseScript').src = base + 'assets/js/base.js';
  })();
</script>

</head>
<body>
<main class="container">

<section class="hero">
  <h1 class="post-title" id="postTitle">Loading…</h1>
  <div class="meta" id="postMeta"></div>
</section>

<div class="split">
  <div class="card">
    <div class="prose" id="postBody"></div>
    <div class="actions" id="postActions" style="margin-top:16px;"></div>
  </div>
  <div class="card">
    <h3>Worksheet PDF</h3>
    <p>Preview the PDF here.</p>
    <div class="pdf-box" id="pdfBox"></div>
  </div>
</div>

</main>

<script>
  (function loadAfterBase(){
    function join(base, rel){ return (base.endsWith('/')?base:base+'/') + rel; }
    function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
    var parts = window.location.pathname.split('/').filter(Boolean);
    var base = (window.location.hostname.endsWith('github.io') && parts.length>=1) ? '/' + parts[0] + '/' : '/';
    Promise.resolve()
      .then(function(){ return loadScript(join(base,'assets/js/layout.js')); })
      .then(function(){ return loadScript(join(base,'assets/js/markdown.js')); })
      .then(function(){ if(window.DH && window.DH.renderLayout) window.DH.renderLayout(); })
      .then(function(){ 
var params = new URLSearchParams(window.location.search);
var c = params.get('c');
var p = params.get('p');
var titleEl = document.getElementById('postTitle');
var metaEl = document.getElementById('postMeta');
var bodyEl = document.getElementById('postBody');
var pdfBox = document.getElementById('pdfBox');
var actions = document.getElementById('postActions');

function fmtDate(s){ try{ return new Date(s).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}catch(e){return s;} }

if(!c || !p){
  titleEl.textContent = 'Missing worksheet';
  bodyEl.innerHTML = '<p>Please open this page from a category card.</p>';
} else {
  var mdUrl = window.DH.base + 'education/categories/' + c + '/posts/' + p + '.md';
  fetch(mdUrl).then(r=>r.text()).then(function(raw){
    var parsed = window.DH.md.parseFrontMatter(raw);
    var meta = parsed.meta, body = parsed.body;

    titleEl.textContent = meta.title || p;

    var tags = Array.isArray(meta.tags) ? meta.tags : (meta.tags ? [meta.tags] : []);
    metaEl.innerHTML =
      '<span>📚 ' + (meta.grade || c) + '</span>' +
      (meta.date ? '<span>📅 ' + fmtDate(meta.date) + '</span>' : '') +
      (tags.length ? '<span>🏷️ ' + tags.join(', ') + '</span>' : '');

    bodyEl.innerHTML = window.DH.md.renderMarkdown(body);

    var pdfRel = meta.pdf || ('pdf/' + p + '.pdf');
    var pdfUrl = window.DH.base + 'education/categories/' + c + '/' + pdfRel;
    pdfBox.innerHTML = '<iframe title="PDF preview" src="'+ pdfUrl +'"></iframe>';

    actions.innerHTML =
      '<a class="btn primary" href="'+ pdfUrl +'" target="_blank" rel="noopener">Open PDF</a>' +
      '<button class="btn" id="copyBtn" type="button">Copy link</button>' +
      '<a class="btn" href="'+ window.DH.base +'education/categories/' + c + '/">Back</a>';

    document.getElementById('copyBtn').addEventListener('click', function(){
      var shareUrl = window.location.href;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(shareUrl).then(()=>alert('Link copied!')).catch(()=>prompt('Copy this link:', shareUrl));
      } else {
        prompt('Copy this link:', shareUrl);
      }
    });
  }).catch(function(err){
    console.error(err);
    titleEl.textContent = 'Could not load worksheet';
    bodyEl.innerHTML = '<p>Please check file paths.</p>';
  });
}
 })
      .catch(function(e){ console.error(e); });
  })();
</script>

</body>
</html>
