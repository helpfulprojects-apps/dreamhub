<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DreamHub</title>

<script src="" id="dhBaseScript"></script>
<link rel="stylesheet" href="" id="dhCss">
<script>
  (function(){
    var parts = window.location.pathname.split('/').filter(Boolean);
    var base = (window.location.hostname.endsWith('github.io') && parts.length>=1) ? '/' + parts[0] + '/' : '/';
    document.getElementById('dhCss').href = base + 'assets/css/site.css';
    document.getElementById('dhBaseScript').src = base + 'assets/js/base.js';
  })();
</script>

</head>
<body>
<main class="container">

<section class="hero">
  <h1>Welcome to DreamHub</h1>
  <p>Education, blogs and apps in one place. Start with Education.</p>
</section>

<section class="grid cards">
  <div class="card">
    <h3>Education</h3>
    <p>Grades, Kannada and Brain Games.</p>
    <div class="actions"><a class="btn primary" href="#" data-link="education/">Open</a></div>
  </div>
  <div class="card">
    <h3>Apps</h3>
    <p>Placeholder for future apps.</p>
    <div class="actions"><a class="btn" href="#" data-link="apps/">Open</a></div>
  </div>
  <div class="card">
    <h3>Blog</h3>
    <p>Placeholder for future posts.</p>
    <div class="actions"><a class="btn" href="#" data-link="blog/">Open</a></div>
  </div>
</section>

</main>

<script>
  (function loadAfterBase(){
    function join(base, rel){ return (base.endsWith('/')?base:base+'/') + rel; }
    function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
    var parts = window.location.pathname.split('/').filter(Boolean);
    var base = (window.location.hostname.endsWith('github.io') && parts.length>=1) ? '/' + parts[0] + '/' : '/';
    Promise.resolve()
      .then(function(){ return loadScript(join(base,'assets/js/layout.js')); })
      .then(function(){ return loadScript(join(base,'assets/js/markdown.js')); })
      .then(function(){ if(window.DH && window.DH.renderLayout) window.DH.renderLayout(); })
      .then(function(){ 
document.querySelectorAll('[data-link]').forEach(function(a){
  a.href = window.DH.base + a.getAttribute('data-link');
});
 })
      .catch(function(e){ console.error(e); });
  })();
</script>

</body>
</html>
